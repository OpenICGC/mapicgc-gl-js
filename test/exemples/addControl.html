<html>

<head>
    <meta charset='utf-8' />
    <title>test mapicgc-gl-js</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <!-- v6 de maplibre-gl és ESM-only: ja no hi ha bundle UMD, per tant
         el vostre dist tampoc en pot generar un que funcioni sol amb
         <script src>. Cal carregar-lo com a mòdul. -->
    <link href="../../dist/mapicgc-gl.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%
        }
    </style>
</head>

<body>


    <div id="map" class="map"></div>

    <script type="module">
        // Import ES module del vostre propi build (ex.: dist/mapicgc-gl.mjs,
        // segons com l'anomeneu al vite.config). Ja no cal carregar
        // maplibre-gl per separat: la llibreria en reexporta el namespace.
        import { Map, Config, maplibregl } from "../../dist/mapicgc-gl.mjs";

        async function initMap() {
            const data = await Config.getConfigICGC();
            const map = new Map({
                container: "map",
                style: data.Styles.TOPO,
                center: [2.1464, 41.306],
                zoom: 7.4,
                maxZoom: 19,
                hash: true,
                pitch: 0,
            });
            map.on("load", () => {
                // mapicgc-gl-js library:
                map.addGeolocateControl(
                    {
                        positionOptions: {
                            enableHighAccuracy: true,
                        },
                        trackUserLocation: true,
                    },
                    "bottom-right"
                );
                map.addNavigationControl();
                map.addExportControl();
                map.addMouseCoordControl();
                map.addFullscreenControl({}, 'top-right')
                // control natiu de maplibre-gl (v6), via el namespace reexportat:
                map.addControl(new maplibregl.NavigationControl(), "bottom-right");
            });
        }
        initMap()
    </script>
</body>

</html>
