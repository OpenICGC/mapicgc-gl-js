<html>

<head>
    <meta charset='utf-8' />
    <title>addMapStyle</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link href="../../dist/mapicgc-gl.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%
        }
    </style>
</head>

<body>
    <div id="map" class="map"></div>
    <script type="module">
        import { Map, Config } from "../../dist/mapicgc-gl.mjs";

        async function initMap() {
            const data = await Config.getConfigICGC();

            const map = new Map({
                container: 'map',
                style: data.Styles.ORTO,
                center: [1.1464, 41.706],
                zoom: 7.4,
                hash: true,
                pitch: 0,
            });
            
            map.on("load", () => {
                map.flyTo({
                    center: [2.812786, 41.98559],
                    zoom: 14,
                });

              
            });
        }


        initMap();
    </script>
</body>

</html>
